<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sports Plus International — Tài liệu nội bộ</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #f7f6f3;
    color: #1a1a1a;
    min-height: 100vh;
  }

  header {
    background: #fff;
    border-bottom: 1px solid #e8e4de;
    padding: 20px 24px;
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .brand-dot {
    width: 36px;
    height: 36px;
    background: #d4550c;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-weight: 800;
    font-size: 18px;
    flex-shrink: 0;
  }

  header h1 {
    font-size: 17px;
    font-weight: 700;
    color: #1a1a1a;
    line-height: 1.2;
  }

  header p {
    font-size: 12px;
    color: #888;
    margin-top: 2px;
  }

  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  .section-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #999;
    margin-bottom: 14px;
  }

  .doc-grid {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 40px;
  }

  .doc-card {
    background: #fff;
    border: 1px solid #e8e4de;
    border-radius: 14px;
    padding: 20px;
    text-decoration: none;
    color: inherit;
    display: flex;
    align-items: center;
    gap: 16px;
    transition: box-shadow 0.15s, transform 0.15s;
  }

  .doc-card:hover {
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    transform: translateY(-1px);
  }

  .doc-icon {
    width: 48px;
    height: 48px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    flex-shrink: 0;
  }

  .doc-icon.orange { background: #fff3ed; }
  .doc-icon.blue   { background: #eff6ff; }
  .doc-icon.green  { background: #f0fdf4; }

  .doc-info { flex: 1; min-width: 0; }

  .doc-title {
    font-size: 15px;
    font-weight: 700;
    color: #1a1a1a;
    margin-bottom: 4px;
  }

  .doc-desc {
    font-size: 13px;
    color: #666;
    line-height: 1.4;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .doc-arrow {
    color: #ccc;
    font-size: 18px;
    flex-shrink: 0;
  }

  .doc-tag {
    display: inline-block;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.05em;
    padding: 2px 8px;
    border-radius: 20px;
    margin-top: 6px;
    text-transform: uppercase;
  }

  .tag-internal { background: #fff3ed; color: #d4550c; }
  .tag-research { background: #eff6ff; color: #2563eb; }

  footer {
    text-align: center;
    padding: 24px;
    font-size: 12px;
    color: #bbb;
    border-top: 1px solid #e8e4de;
  }
</style>
</head>
<body>

<header>
  <div class="brand-dot">S</div>
  <div>
    <h1>Sports Plus International</h1>
    <p>Tài liệu nội bộ</p>
  </div>
</header>

<main>
  <p class="section-label">Tài liệu</p>

  <div class="doc-grid">

    <a class="doc-card" href="sotay-nhanvien.html">
      <div class="doc-icon orange">📋</div>
      <div class="doc-info">
        <div class="doc-title">Sổ Tay Nhân Viên</div>
        <div class="doc-desc">Quy định, quyền lợi, sơ đồ tổ chức &amp; văn hóa công ty</div>
        <span class="doc-tag tag-internal">Nội bộ</span>
      </div>
      <div class="doc-arrow">›</div>
    </a>

    <a class="doc-card" href="whey-infographic.html">
      <div class="doc-icon blue">📊</div>
      <div class="doc-info">
        <div class="doc-title">Chuỗi Giá Trị Whey</div>
        <div class="doc-desc">Từ trang trại đến brand — 6 stages, margin map &amp; phân tích</div>
        <span class="doc-tag tag-research">Nghiên cứu</span>
      </div>
      <div class="doc-arrow">›</div>
    </a>

  </div>
</main>

<footer>
  Sports Plus International &copy; 2025 — Chỉ dành cho nội bộ
</footer>

</body>
</html>
